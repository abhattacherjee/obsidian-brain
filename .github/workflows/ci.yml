# Adaptive CI — generated by /harden-repo
# Cost-optimized: PR runs full validation, main runs lightweight release check,
# develop pushes trigger nothing.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Secret scan — runs on all PRs ──────────────────────────
  secret-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          set -euo pipefail
          DIFF_OUTPUT=$(git diff origin/${{ github.base_ref }}...HEAD -- ':!scripts/*' ':!docs/*' ':!*.md' ':!.claude/hooks/*' ':!.github/workflows/*' ':!tests/*' || true)
          if [ -z "$DIFF_OUTPUT" ]; then
            echo "No diffable content (docs/scripts only) — skipping"
            exit 0
          fi
          if echo "$DIFF_OUTPUT" | grep '^+' | grep -v '^+++' | grep -E "(sk-[a-zA-Z0-9_-]{20,}|AKIA[0-9A-Z]{16}|private_key|-----BEGIN.*PRIVATE KEY-----|ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82}|xox[bsapr]-[a-zA-Z0-9-]+|password\s*[:=]\s*['\"][^'\"]{8,}|Bearer\s+[A-Za-z0-9._-]{20,}|(token|secret|api_key)\s*[:=]\s*[A-Za-z0-9+/=]{40,})"; then
            echo "::error::Potential secrets detected in diff"
            exit 1
          fi
          echo "No secrets detected"

  # ── Changelog gate — PRs to main only ──────────────────────
  changelog-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check changelog updated
        run: |
          if ! git diff origin/main...HEAD --name-only | grep -q 'CHANGELOG.md'; then
            echo "::error::CHANGELOG.md has no changes. Update the changelog before merging to main."
            exit 1
          fi

  # Whole test files stay together so both invoking hosts remain paired.
  coverage-shards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run coverage shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shard-data"
          python scripts/ci-checks/test_shards.py list --count 6 --index "${{ matrix.shard }}" --manifest "$RUNNER_TEMP/shard-data/manifest.json" > "$RUNNER_TEMP/shard-files"
          mapfile -t TEST_FILES < "$RUNNER_TEMP/shard-files"
          PYTHONUNBUFFERED=1 PYTHONPATH=hooks:tests pytest -p parity_collection_plugin --parity-matrix docs/parity/capabilities.json "${TEST_FILES[@]}" -n 4 --deselect=tests/test_security.py::TestDecisionTimeIsBounded:: --deselect=tests/test_security.py::TestPatternDecisionTimeIsBounded:: -o addopts=--tb=short -q --basetemp="$RUNNER_TEMP/pytest-coverage" --cov=hooks --cov-report= --cov-fail-under=0
          if [[ "${{ matrix.shard }}" == 0 ]]; then
            PYTHONUNBUFFERED=1 PYTHONPATH=hooks:tests pytest -p parity_collection_plugin --parity-matrix docs/parity/capabilities.json tests/test_security.py::TestDecisionTimeIsBounded tests/test_security.py::TestPatternDecisionTimeIsBounded -p no:xdist -o addopts=--tb=short -q --basetemp="$RUNNER_TEMP/pytest-coverage-timing" --cov=hooks --cov-append --cov-report= --cov-fail-under=0
          fi
          cp .coverage "$RUNNER_TEMP/shard-data/.coverage"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/shard-data/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Preserve the required check name and enforce the full combined threshold.
  python-tests:
    needs: coverage-shards
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every coverage shard
        env:
          SHARD_RESULT: ${{ needs.coverage-shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage-artifacts
          merge-multiple: false
      - name: Require complete partition and combined 90% coverage
        run: python scripts/ci-checks/test_shards.py coverage --count 6 --prefix coverage-shard --artifacts "$RUNNER_TEMP/coverage-artifacts"

  # Python 3.9 remains a full test gate without a second coverage measurement.
  py39-shards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Python 3.9 shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shard-data"
          python scripts/ci-checks/test_shards.py list --count 4 --index "${{ matrix.shard }}" --manifest "$RUNNER_TEMP/shard-data/manifest.json" > "$RUNNER_TEMP/shard-files"
          mapfile -t TEST_FILES < "$RUNNER_TEMP/shard-files"
          PYTHONUNBUFFERED=1 PYTHONPATH=hooks:tests pytest -p parity_collection_plugin --parity-matrix docs/parity/capabilities.json "${TEST_FILES[@]}" -n 4 --deselect=tests/test_security.py::TestDecisionTimeIsBounded:: --deselect=tests/test_security.py::TestPatternDecisionTimeIsBounded:: -o addopts=--tb=short -q --basetemp="$RUNNER_TEMP/pytest-py39"
          if [[ "${{ matrix.shard }}" == 0 ]]; then
            PYTHONUNBUFFERED=1 PYTHONPATH=hooks:tests pytest -p parity_collection_plugin --parity-matrix docs/parity/capabilities.json tests/test_security.py::TestDecisionTimeIsBounded tests/test_security.py::TestPatternDecisionTimeIsBounded -p no:xdist -o addopts=--tb=short -q --basetemp="$RUNNER_TEMP/pytest-py39-timing"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: py39-shard-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/shard-data/manifest.json
          if-no-files-found: error
          retention-days: 7

  python-tests-py39:
    needs: py39-shards
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python 3.9 shard
        env:
          SHARD_RESULT: ${{ needs.py39-shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - uses: actions/download-artifact@v8
        with:
          pattern: py39-shard-*
          path: ${{ runner.temp }}/py39-artifacts
          merge-multiple: false
      - name: Require complete Python 3.9 partition
        run: python scripts/ci-checks/test_shards.py validate --count 4 --prefix py39-shard --artifacts "$RUNNER_TEMP/py39-artifacts"

  # ── DB-pollution guard — blocks bare ensure_index() in tests (GH #46) ─
  no-default-db-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assert every DB-opening call in tests/ passes db_path
        run: python3 scripts/ci-checks/no-default-db.py

  host-neutral-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check shared host rules and reviewed adapters
        run: python3 scripts/ci-checks/host_neutral_lint.py

  # ── Security tests — runs on all PRs ──────────────────────────
  security-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run security tests
        env:
          OB_HOOKS_DIR: hooks
        run: bash scripts/test-security.sh

  # ── Post-merge: release verification (main only, advisory) ─
  detect-release-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check if release/hotfix merge
        id: check
        run: |
          MERGE_MSG=$(git log -1 --format=%s HEAD)
          if echo "$MERGE_MSG" | grep -qE 'release/|hotfix/'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            VERSION=$(echo "$MERGE_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify GitHub Release exists (advisory)
        if: steps.check.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          if [ -n "$VERSION" ]; then
            gh release view "$VERSION" --json tagName || \
              echo "::warning::GitHub Release $VERSION not found. Was git-flow-finish.sh used?"
          fi
