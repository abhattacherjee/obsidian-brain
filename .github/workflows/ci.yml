# Adaptive CI — generated by /harden-repo
# Cost-optimized: PR runs full validation, main runs lightweight release check,
# develop pushes trigger nothing.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Wall-clock budget tests: deselected from the parallel test jobs and run
  # alone in timed-tests. One value, so the two lists cannot drift (GH #485).
  # Space-separated pytest node ids; none may contain a space or a glob.
  # The lessons speed test is here because under xdist it took 20.8 s of its
  # 30 s CI budget (1.4 s alone on a laptop).
  TIMED_TESTS: >-
    tests/test_security.py::TestDecisionTimeIsBounded
    tests/test_lessons_corpus.py::test_top_candidates_speed_4000_items

jobs:
  # ── Secret scan — runs on all PRs ──────────────────────────
  secret-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          set -euo pipefail
          DIFF_OUTPUT=$(git diff origin/${{ github.base_ref }}...HEAD -- ':!scripts/*' ':!docs/*' ':!*.md' ':!.claude/hooks/*' ':!.github/workflows/*' ':!tests/*' || true)
          if [ -z "$DIFF_OUTPUT" ]; then
            echo "No diffable content (docs/scripts only) — skipping"
            exit 0
          fi
          if echo "$DIFF_OUTPUT" | grep '^+' | grep -v '^+++' | grep -E "(sk-[a-zA-Z0-9_-]{20,}|AKIA[0-9A-Z]{16}|private_key|-----BEGIN.*PRIVATE KEY-----|ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82}|xox[bsapr]-[a-zA-Z0-9-]+|password\s*[:=]\s*['\"][^'\"]{8,}|Bearer\s+[A-Za-z0-9._-]{20,}|(token|secret|api_key)\s*[:=]\s*[A-Za-z0-9+/=]{40,})"; then
            echo "::error::Potential secrets detected in diff"
            exit 1
          fi
          echo "No secrets detected"

  # ── Changelog gate — PRs to main only ──────────────────────
  changelog-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check changelog updated
        run: |
          if ! git diff origin/main...HEAD --name-only | grep -q 'CHANGELOG.md'; then
            echo "::error::CHANGELOG.md has no changes. Update the changelog before merging to main."
            exit 1
          fi

  # ── Python tests — runs on all PRs ───────────────────────────
  # The suite runs in three kinds of job at once (GH #485):
  # - python-tests and python-tests-py39 run everything except TIMED_TESTS
  #   under pytest-xdist (`-n auto`, one worker per runner core). Most tests
  #   start a process or a git repo, so this splits well.
  # - timed-tests runs TIMED_TESTS serially, in two shards per Python, each
  #   on its own runner. They assert wall-clock budgets, and next to busy
  #   workers a 2,000 ms backstop measured 2,042 ms. They take 5-7 min
  #   serially on CI, so after the parallel step each job would be the sum,
  #   and in one job per Python the 3.9 leg alone came within a minute of
  #   the 8-minute target.
  # The 90% coverage gate is applied without TIMED_TESTS (94.7% without
  # them, measured 2026-11-01).
  # TIMED_TESTS is set once at the top, so the deselect and the run use the
  # same value. A renamed id fails timed-tests (pytest exits 4 on a missing
  # node id, even with other ids next to it), so the split cannot silently
  # drop them. --durations lists the slowest tests in each log, for the next
  # time CI gets slow.
  python-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pytest, coverage and xdist
        run: pip install pytest pytest-cov pytest-xdist
      - name: Run tests with coverage
        run: |
          read -ra timed <<< "$TIMED_TESTS"
          pytest tests/ -n auto -v --tb=short "${timed[@]/#/--deselect=}" --durations=30 --cov=hooks --cov-report=term-missing --cov-fail-under=90

  # ── Python 3.9 floor — macOS system python3 is 3.9 (GH #371) ─
  # hooks.json and the skill snippets run bare `python3`, so the plugin must
  # import and pass on the macOS system python3 (3.9). No coverage
  # gate here; the 3.12 job above owns that.
  python-tests-py39:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Install pytest and xdist
        run: pip install pytest pytest-xdist
      - name: Run tests on Python 3.9
        run: |
          read -ra timed <<< "$TIMED_TESTS"
          pytest tests/ -n auto -q --tb=short "${timed[@]/#/--deselect=}" --durations=30

  # ── Wall-clock budget tests — alone on their own runner (GH #485) ─
  # Each shard collects the TIMED_TESTS node ids and runs every other one
  # (odd lines for shard 1, even for shard 2), so the two shards together
  # run each collected test exactly once.
  timed-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.9']
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Run timed tests serially (shard ${{ matrix.shard }} of 2)
        run: |
          read -ra timed <<< "$TIMED_TESTS"
          # With no ids, --collect-only would list the whole suite.
          [ "${#timed[@]}" -gt 0 ] || { echo "::error::TIMED_TESTS is empty"; exit 1; }
          ids="$RUNNER_TEMP/timed-ids.txt"
          shard_ids="$RUNNER_TEMP/timed-shard-ids.txt"
          # A missing id exits 4 here, before anything runs. -qq because
          # setup.cfg's addopts -v would turn a single -q into the tree view.
          pytest --collect-only -qq "${timed[@]}" > "$ids"
          grep '::' "$ids" | awk -v shard="$SHARD" 'NR % 2 == shard % 2' > "$shard_ids"
          # An empty @file makes pytest collect the whole suite, so stop.
          test -s "$shard_ids"
          echo "shard $SHARD: $(wc -l < "$shard_ids") of $(grep -c '::' "$ids") tests"
          pytest "@$shard_ids" -q --tb=short --durations=15
        env:
          SHARD: ${{ matrix.shard }}

  # ── DB-pollution guard — blocks bare ensure_index() in tests (GH #46) ─
  no-default-db-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assert every DB-opening call in tests/ passes db_path
        run: python3 scripts/ci-checks/no-default-db.py

  # ── Security tests — runs on all PRs ──────────────────────────
  security-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run security tests
        env:
          OB_HOOKS_DIR: hooks
        run: bash scripts/test-security.sh

  # ── Post-merge: release verification (main only, advisory) ─
  detect-release-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check if release/hotfix merge
        id: check
        run: |
          MERGE_MSG=$(git log -1 --format=%s HEAD)
          if echo "$MERGE_MSG" | grep -qE 'release/|hotfix/'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            VERSION=$(echo "$MERGE_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify GitHub Release exists (advisory)
        if: steps.check.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          if [ -n "$VERSION" ]; then
            gh release view "$VERSION" --json tagName || \
              echo "::warning::GitHub Release $VERSION not found. Was git-flow-finish.sh used?"
          fi
