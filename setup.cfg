[tool:pytest]
testpaths = tests
addopts = -v --tb=short

[coverage:run]
patch = subprocess
source = hooks
# Authored shell tests execute this module from a verified installed copy.
source_pkgs = skill_procedures
omit =
    # Legacy monolith with deeply intertwined I/O (subprocess, cache, filesystem).
    # Tested via targeted tests in test_obsidian_utils.py but too I/O-heavy for
    # threshold enforcement. New pure-logic modules should NOT be added here.
    hooks/obsidian_utils.py
    # Thin CLI wrapper — no logic, just import + call already-tested functions.
    # Validated by test_skill_snippets.py (syntax) and /dev-test (integration).
    hooks/deep_cli.py
    # Apply the same existing policy to SHA-verified installed test copies.
    */installed plugin with spaces/hooks/obsidian_utils.py
    */installed plugin with spaces/hooks/deep_cli.py
    */loaded installation with spaces/hooks/obsidian_utils.py
    */loaded installation with spaces/hooks/deep_cli.py

[coverage:paths]
hooks =
    hooks
    */installed plugin with spaces/hooks
    */loaded installation with spaces/hooks

[coverage:report]
fail_under = 90
show_missing = true
# Combined installed-copy data is mapped back to these canonical paths.
# Keep the same existing exclusions after that mapping.
omit =
    hooks/obsidian_utils.py
    hooks/deep_cli.py
exclude_lines =
    pragma: no cover
    if __name__ == .__main__
    def main\(
    def _run\(
